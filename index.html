<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Neon Dodge 🎮</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; background:#05060a; touch-action:none;
    font-family:system-ui,-apple-system,sans-serif; user-select:none; }
  canvas { display:block; }
  #ui {
    position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    color:#fff; pointer-events:none;
  }
  #ui.hidden { display:none; }
  #title { font-size:34px; font-weight:800; letter-spacing:2px;
    background:linear-gradient(90deg,#00f5ff,#ff00e5); -webkit-background-clip:text;
    background-clip:text; color:transparent; margin-bottom:10px; }
  #sub { font-size:15px; color:rgba(255,255,255,.55); margin-bottom:28px; line-height:1.8; }
  #btn {
    pointer-events:auto; padding:15px 44px; font-size:18px; font-weight:700;
    border:none; border-radius:50px; cursor:pointer; color:#05060a;
    background:linear-gradient(90deg,#00f5ff,#a8ff00);
    box-shadow:0 0 30px rgba(0,245,255,.5); transition:transform .15s;
  }
  #btn:active { transform:scale(.94); }
  #score { position:fixed; top:18px; left:0; right:0; text-align:center;
    color:#fff; font-size:26px; font-weight:800; letter-spacing:1px;
    text-shadow:0 0 20px rgba(0,245,255,.8); pointer-events:none; }
  #best { position:fixed; top:52px; left:0; right:0; text-align:center;
    color:rgba(255,255,255,.4); font-size:13px; letter-spacing:1px; pointer-events:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="score">0</div>
<div id="best">رکورد: 0</div>
<div id="ui">
  <div id="title">NEON DODGE</div>
  <div id="sub">انگشتت رو بکش تا توپ حرکت کنه<br>از موانع فرار کن</div>
  <button id="btn">شروع</button>
</div>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const ui = document.getElementById('ui');
const btn = document.getElementById('btn');

let W, H, DPR;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resize();
addEventListener('resize', resize);

const rand = (a, b) => a + Math.random() * (b - a);

// ---- وضعیت بازی ----
let state = 'menu'; // menu | playing | over
let score = 0;
let best = +(localStorage.getItem('neonDodgeBest') || 0);
bestEl.textContent = 'رکورد: ' + best;

const ball = { x: 0, y: 0, r: 14, targetX: 0, hue: 190 };
let obstacles = [];
let particles = [];
let spawnTimer = 0;
let spawnGap = 60; // فریم
let speed = 3.5;
let frame = 0;

function resetGame() {
  ball.x = W / 2;
  ball.targetX = W / 2;
  ball.y = H - 110;
  obstacles = [];
  particles = [];
  score = 0;
  frame = 0;
  speed = 3.5;
  spawnGap = 60;
  spawnTimer = 0;
  scoreEl.textContent = '0';
}

class Obstacle {
  constructor() {
    this.w = rand(70, Math.min(150, W * 0.35));
    this.h = 22;
    this.x = rand(0, W - this.w);
    this.y = -this.h;
    this.hue = rand(0, 360);
    this.passed = false;
  }
  update() {
    this.y += speed;
  }
  draw() {
    ctx.shadowBlur = 18;
    ctx.shadowColor = `hsl(${this.hue},100%,60%)`;
    ctx.fillStyle = `hsl(${this.hue},100%,60%)`;
    const r = 6;
    ctx.beginPath();
    ctx.roundRect(this.x, this.y, this.w, this.h, r);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.beginPath();
    ctx.roundRect(this.x + 4, this.y + 3, this.w - 8, 4, 2);
    ctx.fill();
  }
}

function explode(x, y, hue, n = 18) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), s = rand(1, 7);
    particles.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: 1, decay: rand(0.015, 0.04), hue, r: rand(1.5, 4)
    });
  }
}

// ---- کنترل لمسی ----
let touching = false;
function setTarget(clientX) {
  ball.targetX = Math.max(ball.r, Math.min(W - ball.r, clientX));
}
cv.addEventListener('pointerdown', e => { touching = true; setTarget(e.clientX); });
cv.addEventListener('pointermove', e => { if (touching) setTarget(e.clientX); });
cv.addEventListener('pointerup', () => touching = false);
cv.addEventListener('pointercancel', () => touching = false);

// ---- شروع ----
btn.addEventListener('click', () => {
  resetGame();
  ui.classList.add('hidden');
  state = 'playing';
});

function gameOver() {
  state = 'over';
  explode(ball.x, ball.y, ball.hue, 40);
  if (score > best) {
    best = score;
    localStorage.setItem('neonDodgeBest', best);
    bestEl.textContent = 'رکورد: ' + best;
  }
  ui.classList.remove('hidden');
  document.getElementById('title').textContent = 'باختی!';
  document.getElementById('sub').innerHTML =
    `امتیازت: <b style="color:#00f5ff">${score}</b><br>` +
    (score >= best ? '🏆 رکورد جدید!' : `بهترین: ${best}`) +
    '<br>دوباره تلاش کن';
  btn.textContent = 'دوباره';
}

// ---- حلقه ----
function loop() {
  // پس‌زمینه
  ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(5,6,10,0.28)';
  ctx.fillRect(0, 0, W, H);

  if (state === 'playing') {
    frame++;

    // سخت‌تر شدن تدریجی
    speed = 3.5 + frame * 0.0025;
    spawnGap = Math.max(28, 60 - frame * 0.02);

    // حرکت نرم توپ
    ball.x += (ball.targetX - ball.x) * 0.25;

    // تولید مانع
    spawnTimer++;
    if (spawnTimer >= spawnGap) {
      spawnTimer = 0;
      obstacles.push(new Obstacle());
    }

    // به‌روزرسانی موانع
    for (let i = obstacles.length - 1; i >= 0; i--) {
      const o = obstacles[i];
      o.update();
      o.draw();

      // برخورد دایره با مستطیل
      const cx = Math.max(o.x, Math.min(ball.x, o.x + o.w));
      const cy = Math.max(o.y, Math.min(ball.y, o.y + o.h));
      const d = Math.hypot(ball.x - cx, ball.y - cy);
      if (d < ball.r) {
        gameOver();
      }

      // رد شدن و امتیاز
      if (!o.passed && o.y > ball.y) {
        o.passed = true;
        score++;
        scoreEl.textContent = score;
        explode(o.x + o.w / 2, o.y, o.hue, 6);
      }

      if (o.y > H + 50) obstacles.splice(i, 1);
    }
  } else {
    // نمایش موانع در حالت پایان
    for (const o of obstacles) o.draw();
  }

  // ذرات
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.94; p.vy *= 0.94;
    p.life -= p.decay;
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = `hsl(${p.hue},100%,65%)`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
    if (p.life <= 0) particles.splice(i, 1);
  }

  // توپ
  if (state !== 'menu') {
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 30;
    ctx.shadowColor = `hsl(${ball.hue},100%,60%)`;
    ctx.fillStyle = `hsl(${ball.hue},100%,70%)`;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    // هسته سفید
    ctx.fillStyle = 'rgba(255,255,255,.8)';
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r * 0.4, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.globalAlpha = 1;
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
